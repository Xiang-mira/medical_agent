version: 1
description: Generic organ postprocess and QC policy for CT segmentation.

student_containment:
  enabled: true
  description: >
    Anatomy-aware post-processing for prompt-student masks. Child organs,
    vessels, ducts, and tubular structures are clipped to a dilated parent-organ
    ROI. Whole large organs are used as ROI providers and are not clipped by
    default.
  output_suffix: student_predictions_postprocessed
  default_roi_margin_mm: 15.0
  default_parent_source_priority:
    - selected_teacher
    - teacher_updated
    - teacher_case_root
    - student_large_organ
  auto_rules:
    inherit_taxonomy_parent_ids: true
    enabled_hierarchy_roles: [child]
    enabled_comparison_families: [vessel_or_small_structure]
    disabled_major_organs:
      - liver
      - kidney
      - pancreas
      - spleen
      - stomach
      - colon
      - duodenum
      - aorta
      - postcava
      - inferior_vena_cava
  group_margins_mm:
    vessel_or_duct: 20.0
    hollow_gi: 20.0
    core_large_organ: 0.0
    bone_or_fragmented_structure: 0.0
    partial_fov: 0.0
    longtail_uncertain: 15.0
  component_filter:
    vessel_or_duct:
      keep_top_k:
      min_fraction: 0.001
      min_voxels: 16
    sub_organ:
      keep_top_k: 5
      min_fraction: 0.003
      min_voxels: 32
    hollow_gi:
      keep_top_k: 5
      min_fraction: 0.003
      min_voxels: 64
    default:
      keep_top_k: 8
      min_fraction: 0.002
      min_voxels: 64
  containment_rules:
    liver_portal_vein:
      parents: [liver]
      margin_mm: 20.0
    liver_hepatic_vein:
      parents: [liver]
      margin_mm: 20.0
    pancreatic_duct:
      parents: [pancreas]
      margin_mm: 20.0
    lung_upper_left_lobe:
      parents: [lung_left]
      margin_mm: 15.0
    lung_lower_left_lobe:
      parents: [lung_left]
      margin_mm: 15.0
    lung_upper_right_lobe:
      parents: [lung_right]
      margin_mm: 15.0
    lung_middle_right_lobe:
      parents: [lung_right]
      margin_mm: 15.0
    lung_lower_right_lobe:
      parents: [lung_right]
      margin_mm: 15.0
    lung_vessels:
      parents: [lung_left, lung_right]
      margin_mm: 15.0
    liver_segment_1:
      parents: [liver]
      margin_mm: 15.0
    liver_segment_2:
      parents: [liver]
      margin_mm: 15.0
    liver_segment_3:
      parents: [liver]
      margin_mm: 15.0
    liver_segment_4:
      parents: [liver]
      margin_mm: 15.0
    liver_segment_5:
      parents: [liver]
      margin_mm: 15.0
    liver_segment_6:
      parents: [liver]
      margin_mm: 15.0
    liver_segment_7:
      parents: [liver]
      margin_mm: 15.0
    liver_segment_8:
      parents: [liver]
      margin_mm: 15.0
    kidney_left:
      parents: []
      enabled: false
    kidney_right:
      parents: []
      enabled: false
    kidney_cortex:
      parents: [kidney]
      margin_mm: 15.0
    kidney_medulla:
      parents: [kidney]
      margin_mm: 15.0
    kidney_pelvicalyceal_system:
      parents: [kidney]
      margin_mm: 15.0
    colostomy_bag:
      parents: [colon]
      margin_mm: 20.0
    stomach:
      parents: []
      enabled: false
    colon:
      parents: []
      enabled: false
    duodenum:
      parents: []
      enabled: false
  atlasnet_note: >
    AtlasNet is available as a teacher candidate for colon, duodenum, stomach,
    pancreatic_duct, and abdominal tubular structures. This post-processing
    policy does not launch AtlasNet automatically.

volume_gate:
  default_min_ratio: 0.2
  default_max_ratio: 3.0
  groups:
    core_large_organ:
      min_ratio: 0.5
      max_ratio: 1.8
    hollow_gi:
      min_ratio: 0.2
      max_ratio: 3.0
    vessel_or_duct:
      min_ratio: 0.05
      max_ratio: 5.0
    bone_or_fragmented_structure:
      min_ratio: 0.05
      max_ratio: 8.0
    partial_fov:
      min_ratio: 0.05
      max_ratio: 10.0

threshold_sweep:
  thresholds: [0.3, 0.5, 0.7, 0.9]
  selection_metric_with_gt: dice_gt_with_volume_penalty
  selection_metric_without_gt: dice_teacher_with_volume_penalty

postprocess:
  core_large_organ:
    strategy: keep_largest_or_top_k_components
    remove_tiny_components: true
    body_mask_clip: true
  hollow_gi:
    strategy: top_k_components_with_body_or_abdomen_roi
    remove_tiny_components: true
    body_mask_clip: true
  vessel_or_duct:
    strategy: preserve_thin_connected_structures
    remove_isolated_blobs: true
    do_not_force_single_largest_component: true
  bone_or_fragmented_structure:
    strategy: allow_multiple_components_with_location_qc
  longtail_uncertain:
    strategy: conservative_body_clip_and_review
