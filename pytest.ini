[pytest]
testpaths = agent-harness/tests
norecursedirs = checkpoints third_party outputs .git
markers =
    static_audit: configuration and mapping audits that do not load images or models
    cpu_unit: CPU-only unit tests
    cpu_nifti_integration: CPU-only NIfTI geometry and ROI integration tests
    gpu_smoke: lightweight GPU test guarded by scripts/check_gpu_resources.py
    gpu_real_inference: real model inference guarded by scripts/check_gpu_resources.py
    gpu_benchmark: GPU timing benchmark guarded by scripts/check_gpu_resources.py
